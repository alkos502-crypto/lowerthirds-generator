<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Lower Thirds Generator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="app-head">
      <h1>Нижние трети</h1>
      <span class="sub">из CSV в MOGRT</span>
    </header>

    <section class="card">
      <h2 class="card-title">Данные титров</h2>
      <button id="btnCsv" class="btn">Выбор файла данных титров</button>
      <input type="file" id="csvFile" accept=".csv,.txt,.tsv" style="display:none" />
      <div id="csvInfo" class="hint hidden"></div>
    </section>

    <section class="card">
      <h2 class="card-title">MOGRT-шаблон</h2>
      <div class="tiny">Видео-трек: V3 (Video 3) · Длительность: 7 сек</div>
      <div class="tiny" id="mogrtPath"></div>
      <div id="mogrtInfo" class="hint hidden"></div>
    </section>

    <div style="padding:10px 14px">
      <button id="btnCreate" class="btn primary" disabled>Создать нижние трети</button>
      <div class="tiny note">Титры длительностью 7 сек выкладываются на выбранный трек, стык в стык, от точки воспроизведения. ФИО → «Имя Фамилия», Должность → «Должность».</div>
    </div>

    <div id="log" class="log"></div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
